<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page introuvable | Arnaud Herr</title>
<style>
  @font-face{
    font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(assets/fonts/sg-latin.woff2) format('woff2');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;display:flex;align-items:center;
    background:linear-gradient(140deg,#2A2A26,#1B1B19 55%,#233028);color:#fff;
    font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:640px;margin-inline:auto;padding-inline:clamp(20px,5vw,44px)}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;
    letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:18px;
  }
  .eyebrow::before{content:'';width:24px;height:1px;background:#EF7E5D}
  h1{font-size:clamp(2rem,1.4rem + 2.6vw,3rem);line-height:1.06;letter-spacing:-.034em;font-weight:600;margin-bottom:14px}
  p{color:rgba(255,255,255,.76);margin-bottom:30px;max-width:44ch}
  a{
    display:inline-flex;align-items:center;gap:10px;background:#EF7E5D;color:#fff;
    text-decoration:none;padding:16px 28px;border-radius:100px;font-size:16px;font-weight:600;line-height:1;
    transition:background .25s;
  }
  a:hover{background:#E3684A}
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Erreur 404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être périmé, ou l'adresse comporte une faute de frappe.</p>
    <a href="./">Retour à l'accueil</a>
  </main>
</body>
</html>
